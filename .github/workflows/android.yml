name: Build and publish Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      emulator:
        description: Also run the hosted Android 15 emulator smoke test
        type: boolean
        default: false
      phone_preview:
        description: Build a temporary APK that can sit beside the installed version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hangzhou-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          gradle_zip="$RUNNER_TEMP/gradle-8.9-bin.zip"
          curl --fail --silent --show-error --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$gradle_zip"
          printf '%s  %s\n' d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab "$gradle_zip" | sha256sum -c -
          unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Compile, sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/hangzhou-android"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$stage"/{downloads,picker}
          python3 - <<'PY' | node --check
          from pathlib import Path
          import re
          html = Path('android/picker.html').read_text(encoding='utf-8')
          inline = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          code = '\n'.join(source for source in inline if source.strip())
          assert 'DOMContentLoaded' in code and 'hangzhou-point.gpx' in code
          print(code)
          PY
          gradle -p android/sdk -Pandroid.useAndroidX=true --no-daemon :assembleDebug
          test -n "$(find android/sdk/build/intermediates/javac -name MainActivity.class -print -quit)"
          test -n "$(find android/sdk/build/intermediates/javac -name Fusion.class -print -quit)"
          set -- android/sdk/build/outputs/apk/debug/*-debug.apk
          test "$#" -eq 1
          apk="$stage/downloads/hangzhou-android.apk"
          cp "$1" "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" > "$stage/apk-metadata"
          grep -F "package: name='org.hangzhou.mocklocation' versionCode='3' versionName='1.2.0'" "$stage/apk-metadata"
          unzip -tq "$apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/index.html'
          cp android/sdk/build/pickerAssets/* "$stage/picker/"
          cp android/README.md "$stage/picker/README.md"
          (cd "$stage/picker" && zip -q "$stage/downloads/hangzhou-map-gpx.zip" ./*)
          unzip -tq "$stage/downloads/hangzhou-map-gpx.zip"
          sha256sum "$apk" "$stage/downloads/hangzhou-map-gpx.zip"
      - name: Build a side-by-side Android phone preview
        if: github.event_name == 'workflow_dispatch' && inputs.phone_preview
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/hangzhou-android"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          gradle -p android/sdk -Pandroid.useAndroidX=true -PphonePreview=true --no-daemon :assembleDebug
          set -- android/sdk/build/outputs/apk/debug/*-debug.apk
          test "$#" -eq 1
          cp "$1" "$stage/hangzhou-phone-preview.apk"
          "$tools/apksigner" verify "$stage/hangzhou-phone-preview.apk"
          "$tools/aapt2" dump badging "$stage/hangzhou-phone-preview.apk" > "$stage/preview-metadata"
          grep -F "package: name='org.hangzhou.mocklocation.preview'" "$stage/preview-metadata"
      - name: Store the temporary phone preview
        if: github.event_name == 'workflow_dispatch' && inputs.phone_preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hangzhou-phone-preview
          path: ${{ runner.temp }}/hangzhou-android/hangzhou-phone-preview.apk
          if-no-files-found: error
          retention-days: 1
      - name: Verify Android simulation and restoration on an emulator
        if: github.event_name == 'workflow_dispatch' && inputs.emulator
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME_17_X64/bin:$ANDROID_HOME/platform-tools:$PATH"
          stage="$RUNNER_TEMP/hangzhou-android"
          gradle -p android/sdk -Pandroid.useAndroidX=true --no-daemon :assembleDebugAndroidTest
          set -- android/sdk/build/outputs/apk/androidTest/debug/*.apk
          test "$#" -eq 1
          cp "$1" "$stage/test.apk"
          image='system-images;android-35;google_apis;x86_64'
          sdkmanager_path=$(find -L "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -x "$sdkmanager_path"
          tools_bin=$(dirname "$sdkmanager_path")
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install emulator "$image"
          export ANDROID_AVD_HOME="$stage/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools_bin/avdmanager" create avd --force --name HangzhouLocationApi35 --package "$image" --path "$ANDROID_AVD_HOME/HangzhouLocationApi35.avd"
          test -f "$ANDROID_AVD_HOME/HangzhouLocationApi35.ini"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi
          "$ANDROID_HOME/emulator/emulator" -avd HangzhouLocationApi35 -no-window -no-snapshot -no-boot-anim -noaudio -gpu software > "$stage/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 210 adb wait-for-device || { cat "$stage/emulator.log"; exit 1; }
          timeout 210 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done' || { cat "$stage/emulator.log"; exit 1; }
          adb shell input keyevent 82
          adb install -g "$stage/downloads/hangzhou-android.apk"
          adb install "$stage/test.apk"
          adb shell cmd location set-location-enabled true
          adb shell appops set org.hangzhou.mocklocation android:mock_location allow
          timeout 75 adb shell am instrument -w -r org.hangzhou.mocklocation.test/org.hangzhou.mocklocation.test.LocationSmokeTest | tee "$stage/smoke.log"
          grep -F 'HANGZHOU_SMOKE_PASS' "$stage/smoke.log" || { adb logcat -d -t 200; exit 1; }
      - name: Publish Android test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=android-v1.2.0
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The Android release already exists.'
            exit 0
          fi
          stage="$RUNNER_TEMP/hangzhou-android"
          cat > "$stage/notes.md" <<'EOF'
          下载 **hangzhou-android.apk**，在 Android 8.0 或以上的手机中安装。开启系统定位，在开发者选项的「选择模拟位置信息应用」中选择本工具。

          此版按软件服务可用性使用 Android 系统定位和 Google 融合定位。工具可分别显示提交状态和回读结果。华为 HMS 适配源码可用，启用需用 AppGallery Connect 的项目配置和签名自行构建。第三方应用仍可能过滤模拟位置。

          已安装旧 APK 时，先恢复真实定位，再卸载旧版、安装新版，并重新选择模拟定位应用。测试签名与旧版不同。

          **hangzhou-map-gpx.zip** 可在浏览器选点和导出 GPX，也可配合 HarmonyOS 6.0 模拟器使用。

          [Android 安装与 HMS 构建说明](https://github.com/zju-zh-dsh/hangzhou-iphone-location/tree/main/android)
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --prerelease \
            --title '杭州市内虚拟定位安卓通用版 v1.2.0' --notes-file "$stage/notes.md" \
            "$stage/downloads/hangzhou-android.apk" "$stage/downloads/hangzhou-map-gpx.zip"
