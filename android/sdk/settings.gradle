pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        if (providers.gradleProperty('enableHms').orNull == 'true') {
            maven {
                url = uri('https://developer.huawei.com/repo/')
                content { includeGroupByRegex('com[.]huawei([.].*)?') }
            }
        }
    }
}

rootProject.name = 'HangzhouLocation'
